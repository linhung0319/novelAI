[project]
name = "derived-sync"
version = "0.1.0"
description = "novelAI 結構定義：源→衍生 過期偵測（比對 .ai.md 的 generated-from hash，零 LLM、可覆算）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
derived-sync = "derived_sync.cli:main"
# 世界觀軸格式閘門：驗 front-matter 收斂後的欄語意、伏筆歸一、rollup 兩欄視圖、
# 幕綱檔名引用。與 `derived-sync validate` **同套件**——世界觀 .ai.md 的格式真相
# 只有一份（validate 管所有 .ai.md 共通的結構，這支管世界觀專屬的欄語意）。
# 先例：object-lint 是 fact-lint 的聚焦入口、ch-lint 與 beat-lint 同套件。
world-lint = "derived_sync.cli:world_lint_main"
# 角色軸格式閘門：源側存在性（「源有衍生無」`check` 在定義上掃不到）、必填節
# 不得是佔位、front-matter 收斂後的欄語意、rollup 視圖 ≡ 各檔 front-matter。
# 與 `world-lint` 同套件同理由——角色 .ai.md 的格式真相只有一份。
char-lint = "derived_sync.cli:char_lint_main"
# 風格軸格式閘門：五個 front-matter 欄的值**可不可核對**（`可用句式` 的顆粒度
# token ＋阿拉伯數字 ＋不得全落最粗一級）、`基調參照` ≡ 摘要衍生檔、禁用詞正文
# 掃描。它的取值者是 LLM 不是程式——依 2026-07-27 改寫後的 A4，那更需要 lint。
style-lint = "derived_sync.cli:style_lint_main"
# 摘要軸格式閘門：**人稱落檔閘門**（封閉二值枚舉，schema 明訂「不得直接封章」
# 而零實作——唯一的書填了非支援值、封了章、寫了 93 章）、基調的源↔衍生比對、
# front-matter 收斂後的欄語意、幕號引用的目的地存在性。與前三支同套件同理由。
summary-lint = "derived_sync.cli:summary_lint_main"
# 就緒軸格式閘門：`story/參照/就緒.md`（A1 源檔）的狀態格五 token 封閉枚舉、
# 恰兩節不得有第三節、五欄五列、清單六條，以及**舊 `就緒儀表` 撤掉了沒有**。
# 它與前四支不同的是**它守的是一支源檔**（A6：無源衍生是要解掉的衝突，不是一種檔）。
readiness-lint = "derived_sync.cli:readiness_lint_main"
# 就緒現況投影（**不是閘門**）：產物軸×深度 20 格／就緒清單六條／局部下沉逐 arc，
# 三節 0 也印。它取代 `就緒儀表.ai.md` 的三節現況——那三節投影出來 306 字元，
# 而它們住的檔是 128,371 字元（419×）。跨套件的機械來源印「未接」＋該跑的指令。
readiness = "derived_sync.cli:readiness_main"

[tool.novelai]
# **射程宣告**（2026-07-30 驗證輪階段 1.5）。`meta-lint` 第 13 項驗宣告 ↔ 位置：
#   `book`     ＝吃 `--book`，消費者是 SKILL.md，住 `tools/`，**進生產包**
#   `repo-dev` ＝守 repo 自己，觸發者是 workflow，住 `devtools/`，不進生產包
# 生產包一律**不含 `tests/`**——黃金檔釘病例書、語料回歸釘 `examples/`，兩者都是開發期資產。
scope = "book"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derived_sync"]
