[project]
name = "prose-metrics"
version = "0.1.0"
description = "novelAI 正文結構統計與跨 arc 漂移偵測（零 LLM、可覆算）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prose-metrics = "prose_metrics.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prose_metrics"]
