[project]
name = "foreshadow-project"
version = "0.1.0"
description = "novelAI 伏筆投影：跨 arc 掃描配對 埋/收[[伏筆:x]]（零 LLM、可覆算）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
foreshadow-project = "foreshadow_project.cli:main"

[tool.novelai]
# **射程宣告**（2026-07-30 驗證輪階段 1.5）。`meta-lint` 第 13 項驗宣告 ↔ 位置：
#   `book`     ＝吃 `--book`，消費者是 SKILL.md，住 `tools/`，**進生產包**
#   `repo-dev` ＝守 repo 自己，觸發者是 workflow，住 `devtools/`，不進生產包
# 生產包一律**不含 `tests/`**——黃金檔釘病例書、語料回歸釘 `examples/`，兩者都是開發期資產。
scope = "book"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreshadow_project"]
