[project]
name = "decision-projection"
version = "0.1.0"
description = "novelAI：裁決流查詢（按標的檔與射程過濾，零 LLM、可覆算）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
decision-project = "decision_projection.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_projection"]
