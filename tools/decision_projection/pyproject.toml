[project]
name = "decision-projection"
version = "0.1.0"
description = "novelAI：裁決流查詢（按標的檔與射程過濾，零 LLM、可覆算）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
decision-project = "decision_projection.cli:main"
# 格式閘門與查詢器分成兩個指令、同一份解析層（先例：`object-lint` 是 `fact-lint`
# 的聚焦入口、`ch-lint` 與 `beat-lint` 同套件）。查詢器不是閘門：不查的時候格式
# 錯不會被發現，而 `write` 依設計不查裁決流。
decision-lint = "decision_projection.cli:lint_main"

[tool.novelai]
# **射程宣告**（2026-07-30 驗證輪階段 1.5）。`meta-lint` 第 13 項驗宣告 ↔ 位置：
#   `book`     ＝吃 `--book`，消費者是 SKILL.md，住 `tools/`，**進生產包**
#   `repo-dev` ＝守 repo 自己，觸發者是 workflow，住 `devtools/`，不進生產包
# 生產包一律**不含 `tests/`**——黃金檔釘病例書、語料回歸釘 `examples/`，兩者都是開發期資產。
scope = "book"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_projection"]
