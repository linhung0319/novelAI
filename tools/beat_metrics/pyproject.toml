[project]
name = "beat-metrics"
version = "0.1.0"
description = "novelAI 幕綱層機械統計：幕的可演性＋分區衛生＋母題重複（零 LLM、可覆算）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beat-metrics = "beat_metrics.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beat_metrics"]
