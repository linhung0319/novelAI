[project]
name = "beat-metrics"
version = "0.1.0"
description = "novelAI 幕號軸：幕綱格式閘門（beat-lint）＋正文層格式閘門（ch-lint）＋大綱層格式閘門（outline-lint）＋結構軸投影（structure-project）＋機械統計（可演性·分區衛生·母題重複）；零 LLM、可覆算"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beat-metrics = "beat_metrics.cli:main"
# 格式閘門：驗幕號／前因／八欄／spine／分區（`beat-metrics` 量漂移，兩者互補）。
# 與 beat-metrics 同套件、共用 scan.py 的八欄解析器——新增一個要記得跑的閘門，
# 就是新增一個會被忘記的觸發時機（同 fact-lint／object-lint 的先例）。
beat-lint = "beat_metrics.cli:lint_main"
# 正文層格式閘門：驗 `<!-- 幕NNN -->` 錨點／`對應幕`／章衍生 front-matter／章序視圖。
# **與 beat-lint 同套件是刻意的**（功能 03 抉擇 1 B）：第 1／3／4 項要的幕號 registry
# 就在 structure.parse_book()，另開套件＝新增第 5 份 spine／幕號集合實作。
ch-lint = "beat_metrics.cli:ch_lint_main"
# 大綱層格式閘門：驗節枚舉／檔頭狀態／伏筆意圖表／卷級方向／引用／索引視圖。
# **第三個指令，同一份解析層**（功能 09 抉擇 1 B）：第 4 項要的幕號 registry 就在
# structure.parse_book()、第 5 項要的伏筆 regex beat-lint 已經在用，另開套件＝
# 新增第 7 份幕號集合實作。大綱曾是全系統唯一「被 共同約定.md 明文列進『強格式源·
# 一支 lint』那一格、而那支 lint 不存在」的產物。
outline-lint = "beat_metrics.cli:outline_lint_main"
# 結構軸投影（**不是閘門**，一律 exit 0）：大綱宣告的選用公式＋幕綱 `結構階段` 欄投影出的
# 「階段 ↔ 幕」對應表＋缺哪個必要階段（集合差）＋舊檔殘留偵測。
# **第四個指令，同一份解析層**（功能 11 抉擇 3 A）：兩個輸入都已在本套件解析——幕綱八欄在
# scan.scan_arc()、幕號 registry 與 spine 在 scan.load_book()、大綱節內容在 outline.load_files()。
# 另開套件＝新增第 8 份幕號集合實作。它取代已廢除的 story/參照/結構.ai.md：那支檔宣稱
# 「無單一源檔可 hash」，而實測對應表 108/108 幕可從幕綱重算（設計原則.md A6 的空訊號）。
structure-project = "beat_metrics.cli:structure_project_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beat_metrics"]
