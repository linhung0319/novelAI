[project]
name = "settings-select"
version = "0.1.0"
description = "novelAI context 取用：依幕綱選取相關設定檔（零 LLM、可覆算）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
settings-select = "settings_select.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/settings_select"]
