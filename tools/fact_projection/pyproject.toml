[project]
name = "fact-projection"
version = "0.2.0"
description = "novelAI：事實流 as-of 投影（狀態／錨／約束，fold，零 LLM、可覆算）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fact-project = "fact_projection.cli:main"
# 格式閘門：驗事實信封行與物件檔（`derived-sync validate` 管 .ai.md 的結構，兩者互補）
fact-lint = "fact_projection.cli:lint_main"
# 物件軸的聚焦入口：同一組檢查、只印物件檔那幾類（給只動物件檔的 skill 用）
object-lint = "fact_projection.cli:object_lint_main"
# 反向索引：誰依賴了這條事實（`derived-sync check` 管正向的新鮮度，兩者互補）
fact-refs = "fact_projection.cli:refs_main"

[tool.novelai]
# **射程宣告**（2026-07-30 驗證輪階段 1.5）。`meta-lint` 第 13 項驗宣告 ↔ 位置：
#   `book`     ＝吃 `--book`，消費者是 SKILL.md，住 `tools/`，**進生產包**
#   `repo-dev` ＝守 repo 自己，觸發者是 workflow，住 `devtools/`，不進生產包
# 生產包一律**不含 `tests/`**——黃金檔釘病例書、語料回歸釘 `examples/`，兩者都是開發期資產。
scope = "book"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fact_projection"]
